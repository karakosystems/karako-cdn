name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/oggen/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet (server)
        run: go vet ./...
      - name: test (server)
        run: go test ./...
      - name: vet (oggen)
        run: go -C tools/oggen vet ./...
      - name: test (oggen)
        run: go -C tools/oggen test ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/oggen/go.sum
      - name: build server
        run: go build -o karako-cdn ./cmd/karako-cdn
      - name: run integration suite
        run: |
          PORT=8080 ./karako-cdn &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/health && break
            sleep 0.5
          done
          ./test.sh 8080

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
