name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: tools/oggen/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet (server)
        run: go vet ./...
      - name: test (server)
        run: go test ./...
      - name: vet (oggen)
        run: go -C tools/oggen vet ./...
      - name: test (oggen)
        run: go -C tools/oggen test ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: tools/oggen/go.sum
      - name: build server
        run: go build -o karako-cdn ./cmd/karako-cdn
      - name: run integration suite
        run: |
          PORT=8080 BASE_FQDN=example.com PUBLIC_DIR=example/public ./karako-cdn &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8080/health && break
            sleep 0.5
          done
          ./test.sh 8080

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build image
        run: docker build -t karako-cdn:ci .
      - name: build the example project on top of it
        run: docker build --build-arg BASE_IMAGE=karako-cdn:ci -t example:ci example
      - name: integration suite against the example image
        run: |
          docker run -d -p 8080:8080 example:ci
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8080/health && break
            sleep 0.5
          done
          ./test.sh 8080
          curl -sf -o /dev/null http://localhost:8080/karako/og-image.png

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
