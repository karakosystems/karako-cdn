name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/oggen/go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan server module
        run: govulncheck ./...
      - name: scan oggen module
        working-directory: tools/oggen
        run: govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tools/oggen/go.sum
      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: scan server module
        run: gosec ./...
      - name: scan oggen module
        working-directory: tools/oggen
        run: gosec ./...
