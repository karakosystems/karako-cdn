pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})" || { gofmt -l {staged_files}; exit 1; }
    - name: vet
      glob: "*.go"
      run: go vet ./... && go -C tools/oggen vet ./...
    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

commit-msg:
  jobs:
    - name: conventional commit
      run: |
        head -n1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' || {
          echo "commit subject must follow conventional commits: type(scope)?: description"
          exit 1
        }

pre-push:
  jobs:
    - name: test server
      run: go test ./...
    - name: test oggen
      run: go -C tools/oggen test ./...
